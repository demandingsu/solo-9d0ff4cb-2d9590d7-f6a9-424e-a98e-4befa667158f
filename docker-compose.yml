services:
  air-quality:
    build: .
    image: air-quality-daily:1.0.0
    container_name: air-quality-daily
    ports:
      - "${AIR_PORT:-8000}:8000"
    environment:
      AIR_DATABASE_PATH: /data/air_quality.db
      TZ: UTC
    volumes:
      - air-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  air-data:
    name: air-quality-data
